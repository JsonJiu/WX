            padding: 20px;

            max-width: 1200px;

            padding: 30px;

            text-align: center;

            font-weight: bold;

        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(39, 174, 96, 0.3);
        }
        
        .preview-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .preview-title {
            font-size: 1.3em;
            color: #34495e;
            margin-bottom: 15px;
            font-weight: bold;
            border-left: 4px solid #3498db;
            padding-left: 12px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            font-size: 12px;
        }
        
        th {
            background: #34495e;
            color: white;
            padding: 10px 8px;
            text-align: center;
            font-weight: bold;
        }
        
        td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #ecf0f1;
        }
        
        tr:hover {
            background: #f1f2f6;
        }
        
        .instruction-header {
            background: #3498db;
            color: white;
            font-weight: bold;
        }
        
        .status {

            padding: 15px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
            text-align: center;
            font-weight: bold;

    </style>

        function generatePreview() {
            const previewDiv = document.getElementById('preview');
            let html = '';
            
            Object.keys(protocolData).forEach(instructionName => {
                html += `<h3 class="instruction-header">${instructionName}</h3>`;
                html += '<table>';
                
                protocolData[instructionName].forEach((row, index) => {
                    if (index === 0) {
                        html += '<tr>';
                        row.forEach(cell => {
                            html += `<th>${cell}</th>`;
                        });
                        html += '</tr>';
                    } else {
                        html += '<tr>';
                        row.forEach(cell => {
                            html += `<td>${cell}</td>`;
                        });
                        html += '</tr>';
                    }
                });
                
                html += '</table>';
            });
            
            previewDiv.innerHTML = html;
        }

        function generateODS() {
            try {
                // 创建新的工作簿
                const wb = XLSX.utils.book_new();
                
                // 为每个指令类型创建工作表
                Object.keys(protocolData).forEach(instructionName => {
                    const ws = XLSX.utils.aoa_to_sheet(protocolData[instructionName]);
                    
                    // 设置列宽
                    const colWidths = [
                        {wch: 8},  // 序号
                        {wch: 12}, // 内容
                        {wch: 8},  // 长度
                        {wch: 40}, // 说明
                        {wch: 12}  // 数据格式
                    ];
                    ws['!cols'] = colWidths;
                    
                    // 添加工作表到工作簿
                    XLSX.utils.book_append_sheet(wb, ws, instructionName);
                });
                
                // 创建一个总览工作表
                const summaryData = [
                    ["指令类型", "指令代码", "长度(字节)", "功能说明"],
                    ["开始测试指令", "0x68 AA", "25", "发送给工装，开始测试"],
                    ["工装返回开始测试指令", "0x68 AB", "6", "工装确认开始测试"],
                    ["查询结果指令", "0x68 AC", "6", "查询测试结果"],
                    ["工装返回查询结果指令", "0x68 AD", "103", "返回详细测试结果"],
                    ["", "", "", ""],
                    ["额外检测项目", "", "", ""],
                    ["触摸按键", "", "", "人工目检"],
                    ["液晶显示", "", "", "人工目检"],
                    ["LoRa检测", "", "", "需勾选，根据EUI查询信号强度"],
                    ["", "", "", ""],
                    ["数据格式说明", "", "", ""],
                    ["HEX", "", "", "16进制格式"],
                    ["BCD", "", "", "BCD码格式"],
                    ["ASCII", "", "", "ASCII字符格式"],
                    ["小端模式", "", "", "低字节在前，高字节在后"]
                ];
                
                const summaryWs = XLSX.utils.aoa_to_sheet(summaryData);
                summaryWs['!cols'] = [
                    {wch: 20},
                    {wch: 15},
                    {wch: 12},
                    {wch: 30}
                ];
                
                XLSX.utils.book_append_sheet(wb, summaryWs, "总览说明", 0);
                
                // 生成ODS文件
                const wbout = XLSX.write(wb, {
                    bookType: 'ods',
                    type: 'array'
                });
                
                // 下载文件
                const blob = new Blob([wbout], {type: 'application/vnd.oasis.opendocument.spreadsheet'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '完整测试指令协议表格.ods';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                document.getElementById('status').innerHTML = 
                    '<div class="status">✅ ODS表格生成成功！文件已开始下载。</div>';
                
            } catch (error) {
                console.error('生成ODS文件失败:', error);
                document.getElementById('status').innerHTML = 
                    '<div class="status" style="background:#f8d7da; border-color:#f5c6cb; color:#721c24;">❌ 生成失败: ' + error.message + '</div>';
            }
        }
        
        // 页面加载时生成预览
