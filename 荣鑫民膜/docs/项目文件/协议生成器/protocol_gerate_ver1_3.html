<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级协议表格生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            align-items: center;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(45deg, #27ae60, #219653);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        .format-select {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            background: white;
        }
        
        .edit-section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }
        
        .edit-section.active {
            display: block;
        }
        
        .instruction-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .instruction-tab {
            padding: 10px 20px;
            background: #ecf0f1;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .instruction-tab.active {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        
        .edit-form {
            display: none;
        }
        
        .edit-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .form-control {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .add-row-btn {
            background: linear-gradient(45deg, #27ae60, #219653);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .preview-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .instruction-section {
            margin-bottom: 30px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .instruction-header {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 15px 20px;
            font-size: 1.2em;
            font-weight: bold;
            position: relative;
        }
        
        .example-command {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
        }
        
        .checksum-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .checksum-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        th {
            background: #34495e;
            color: white;
            padding: 12px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        
        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ecf0f1;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        tr:hover {
            background: #f1f2f6;
        }
        
        .highlight-checksum {
            background: #fff3cd !important;
            border: 2px solid #ffc107 !important;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.5) !important;
        }
        
        .checksum-row {
            background: #d4edda !important;
            font-weight: bold;
        }
        
        .status {
            margin: 20px 0;
            padding: 15px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
            text-align: center;
            font-weight: bold;
        }
        
        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 500px;
            position: relative;
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>高级协议表格生成器</h1>
        
        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="showEditSection()">编辑内容</button>
                <button class="btn btn-warning" onclick="saveToStorage()">保存配置</button>
                <button class="btn btn-danger" onclick="resetToDefault()">恢复默认</button>
                <button class="btn btn-primary" onclick="refreshPreview()">刷新预览</button>
            </div>
            
            <div class="btn-group">
                <label for="formatSelect">导出格式：</label>
                <select id="formatSelect" class="format-select">
                    <option value="ods">ODS (LibreOffice)</option>
                    <option value="xlsx">XLSX (Excel)</option>
                    <option value="xls">XLS (Excel 97-2003)</option>
                    <option value="csv">CSV (文本)</option>
                    <option value="pdf">PDF (打印)</option>
                </select>
                <button class="btn btn-success" onclick="generateFile()">生成文件</button>
            </div>
        </div>
        
        <!-- 编辑区域 -->
        <div id="editSection" class="edit-section">
            <h3>编辑协议内容</h3>
            
            <div class="instruction-tabs">
                <button class="instruction-tab active" onclick="showEditForm('开始测试指令')">开始测试指令</button>
                <button class="instruction-tab" onclick="showEditForm('工装返回开始测试指令')">工装返回开始测试</button>
                <button class="instruction-tab" onclick="showEditForm('查询结果指令')">查询结果指令</button>
                <button class="instruction-tab" onclick="showEditForm('工装返回查询结果指令')">工装返回查询结果</button>
            </div>
            
            <div id="editForms"></div>
            
            <div style="margin-top: 20px;">
                <button class="btn btn-success" onclick="applyChanges()">应用更改</button>
                <button class="btn btn-primary" onclick="hideEditSection()">取消编辑</button>
            </div>
        </div>
        
        <div id="status"></div>
        
        <!-- 预览区域 -->
        <div class="preview-section">
            <div id="preview"></div>
        </div>
    </div>
    
    <!-- 校验计算模态框 -->
    <div id="checksumModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeChecksumModal()">&times;</span>
            <h3>校验计算</h3>
            <div id="checksumContent"></div>
        </div>
    </div>

        // 显示校验计算
        function showChecksumCalculation(instructionName) {
            const example = protocolData[instructionName].example;
            const bytes = example.replace(/\s+/g, '').match(/.{1,2}/g) || [];
            
            let content = `
                <h4>${instructionName} - 校验计算</h4>
                <p><strong>示例指令：</strong> ${example}</p>
                <p><strong>字节分解：</strong></p>
                <div style="font-family: monospace; margin: 10px 0;">
            `;
            
            bytes.forEach((byte, index) => {
                const shouldInclude = index > 0 && index < bytes.length - 1;
                content += `<span style="display: inline-block; margin: 2px; padding: 4px 8px; border-radius: 4px; ${shouldInclude ? 'background: #fff3cd; border: 2px solid #ffc107;' : 'background: #f8f9fa; border: 1px solid #ddd;'}">${byte}</span>`;
            });
            
            content += '</div>';
            
            // 计算校验和
            let checksum = 0;
            for (let i = 1; i < bytes.length - 1; i++) {
                checksum += parseInt(bytes[i], 16);
            }
            const calculatedChecksum = (checksum & 0xFF).toString(16).toUpperCase().padStart(2, '0');
            const actualChecksum = bytes[bytes.length - 2];
            
            content += `
                <p><strong>计算过程：</strong></p>
                <p>需要累加的字节：${bytes.slice(1, -1).join(' + ')}</p>
                <p>十六进制转十进制后相加：${bytes.slice(1, -1).map(b => parseInt(b, 16)).join(' + ')} = ${checksum}</p>
                <p>取低字节：${checksum} & 0xFF = ${checksum & 0xFF}</p>
                <p>转换为十六进制：${calculatedChecksum}</p>
                <p><strong>结果：</strong></p>
                <p>计算得出的校验值：<span style="color: #27ae60; font-weight: bold;">${calculatedChecksum}</span></p>
                <p>指令中的校验值：<span style="color: ${actualChecksum === calculatedChecksum ? '#27ae60' : '#e74c3c'}; font-weight: bold;">${actualChecksum}</span></p>
                <p>校验结果：<span style="color: ${actualChecksum === calculatedChecksum ? '#27ae60' : '#e74c3c'}; font-weight: bold;">${actualChecksum === calculatedChecksum ? '正确' : '错误'}</span></p>
            `;
            
            document.getElementById('checksumContent').innerHTML = content;
            document.getElementById('checksumModal').style.display = 'block';
            
            highlightChecksumRows(instructionName);
        }
        
        // 高亮校验相关行
        function highlightChecksumRows(instructionName) {
            const table = document.getElementById(`table-${instructionName}`);
            if (!table) return;
            
            const rows = table.querySelectorAll('tr');
            rows.forEach((row, index) => {
                if (index === 0) return;
                
                const cells = row.querySelectorAll('td');
                if (cells.length > 3) {
                    const description = cells[3].textContent;
                    if (!description.includes('帧头') && !description.includes('帧尾')) {
                        row.classList.add('highlight-checksum');
                    }
                    if (description.includes('校验')) {
                        row.classList.add('checksum-row');
                    }
                }
            });
        }

                row.classList.remove('highlight-checksum');
            });
        }
        
        // 生成文件
        function generateFile() {
            const format = document.getElementById('formatSelect').value;
            
            try {
                switch (format) {
                    case 'ods':
                    case 'xlsx':
                    case 'xls':
                        generateSpreadsheet(format);
                        break;
                    case 'csv':
                        generateCSV();
                        break;
                    case 'pdf':
                        generatePDF();
                        break;
                    default:
                        throw new Error('不支持的文件格式');
                }

                console.error('生成文件失败:', error);
                showStatus(`生成${format.toUpperCase()}文件失败: ${error.message}`, 'error');

                                    bottom: { style: "thin", color: { rgb: "D0D0D0" } },

            const summaryData = [

                ["开始测试指令", "0x68 AA", "25", "发送给工装，开始测试", protocolData["开始测试指令"].example],
                ["工装返回开始测试指令", "0x68 AB", "6", "工装确认开始测试", protocolData["工装返回开始测试指令"].example],

                ["HEX", "", "", "16进制格式"],
                ["ASCII", "", "", "ASCII字符格式"],
                ["小端模式", "", "", "低字节在前，高字节在后"],
                [],
                ["重要说明"],
                ["校验计算", "", "", "除帧头、校验位、帧尾外所有字节求和取低字节"],

        // 生成CSV文件
        function generateCSV() {
            let csvContent = '';
            
            Object.keys(protocolData).forEach(instructionName => {
                csvContent += `${instructionName}\n`;
                csvContent += `示例指令,${protocolData[instructionName].example}\n`;
                csvContent += '\n';
                
                protocolData[instructionName].data.forEach(row => {
                    csvContent += row.map(cell => `"${cell}"`).join(',') + '\n';
                });
                
                csvContent += '\n';
            });
            
            const blob = new Blob(['\ufeff' + csvContent], {type: 'text/csv;charset=utf-8;'});
            downloadFile(blob, '完整测试指令协议表格.csv');
            
            showStatus('CSV文件生成成功！文件已开始下载。');
        }
        
        // 生成PDF文件
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFont("helvetica");
            
            let yPosition = 20;
            
            doc.setFontSize(16);
            doc.text('测试指令协议文档', 20, yPosition);
            yPosition += 15;
            
            Object.keys(protocolData).forEach(instructionName => {
                if (yPosition > 250) {
                    doc.addPage();
                    yPosition = 20;
                }
                
                doc.setFontSize(14);
                doc.text(instructionName, 20, yPosition);
                yPosition += 10;
                
                doc.setFontSize(10);
                const example = protocolData[instructionName].example;
                const exampleLines = doc.splitTextToSize(`示例指令: ${example}`, 170);
                doc.text(exampleLines, 20, yPosition);
                yPosition += exampleLines.length * 5 + 5;
                
                const tableData = protocolData[instructionName].data.slice(1).map(row => 
                    row.map(cell => String(cell))
                );
                
                const tableHeaders = protocolData[instructionName].data[0];
                
                doc.autoTable({
                    startY: yPosition,
                    head: [tableHeaders],
                    body: tableData,
                    margin: { left: 20 },
                    styles: { fontSize: 8 },
                    headStyles: { fillColor: [52, 73, 94] },
                    columnStyles: {
                        0: { cellWidth: 20 },
                        1: { cellWidth: 30 },
                        2: { cellWidth: 20 },
                        3: { cellWidth: 80 },
                        4: { cellWidth: 25 }
                    }
                });
                
                yPosition = doc.lastAutoTable.finalY + 15;
            });
            
            doc.save('完整测试指令协议表格.pdf');
            showStatus('PDF文件生成成功！文件已开始下载。');
        }
        
        // 下载文件
        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // 刷新预览
        function refreshPreview() {
            generatePreview();
            showStatus('预览已刷新');
        }
        
        // 页面加载时初始化
        function initializePage() {
            loadFromStorage();
            generatePreview();
        }
        
        window.onload = initializePage;
        
        window.onclick = function(event) {
            const modal = document.getElementById('checksumModal');
            if (event.target == modal) {
                closeChecksumModal();
            }
        };
    </script>
</body>
</html>
